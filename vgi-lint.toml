# vgi-lint-check configuration for vgi-ortools.
#
# This worker is pure offline compute: every function solves a self-contained
# problem passed entirely as scalar LIST / JSON arguments, with no backend, no
# secret, and no network. The executable examples are therefore self-contained
# (inline LIST literals and inline JSON models) and run against the attached
# worker, so execution stays ENABLED -- the full metadata + execution gate runs.
#
# The gate fails at `info` (the strictest level), so every function must carry
# title + docs + keywords + result-columns + runnable executable examples, and
# the catalog must carry source_url + tags.
[tool.vgi-lint-check]
fail_on = "info"

# VGI316 (a table function with a single multi-dimensional-array argument should
# take a table input) is deliberately disabled for this worker. Every solver here
# passes its whole problem as scalar integer LIST / matrix arguments, because a VGI
# table function reserves its single subquery slot and most solvers need SEVERAL
# matrices at once (min_cost_flow: arcs + supplies; solve_vrp: distance + demand),
# which a lone table input cannot carry. The single-matrix solvers (assignment,
# tsp, jobshop, knapsack, max_flow) share that same scalar-argument convention so
# the surface stays consistent across the catalog. This is the load-bearing design
# documented in CLAUDE.md, not an oversight.
extend_ignore = ["VGI316"]

[tool.vgi-lint-check.options]
column_comment_min_ratio = 0.8
