# Copyright 2026 Query Farm LLC - https://query.farm
#
# Build + publish the multi-arch vgi-ortools image to ghcr.io. The heavy lifting
# (multi-arch build -> /health smoke -> image SQL suite -> push-by-digest -> manifest
# -> cosign-sign) lives in the shared reusable workflow Query-farm/vgi-actions; this
# file gates on the repo's own CI and supplies the worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z / :X.Y / :latest; push to release tags only (no :edge image on pushes to main).
name: Publish image to ghcr.io

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate every image on the full unit + vgi-extension integration suite, so a
  # broken worker is never imaged.
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-ortools
      smoke_import: "vgi_ortools, ortools, pyarrow"
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
      # Validate the built image's two transports against the signed vgi
      # extension. The worker logic over stdio/http is already exercised every
      # run by the gating `ci` job (all test/sql/*, over stdio, launch and http),
      # so here we just prove the IMAGE speaks the protocol in both modes:
      #   - stdio: cold-boot one container per ATTACH and run the suite;
      #   - HTTP: run the full suite against a SINGLE warm container.
      # $CITEST_IMAGE is the loaded <image>:citest-amd64 ref; GH_TOKEN is
      # provided for the haybarn download.
      image_test: |
        echo "::group::download haybarn-unittest"
        # haybarn 2.0 is RC-only, so `gh release view` (no tag) still returns the
        # 1.5 line: pick the newest haybarn-v2.0.* tag (its community `vgi`
        # extension is the one that speaks the worker's VGI protocol vgi.v3 / 3.1).
        REL=$(gh release list --repo Query-farm-haybarn/haybarn --limit 30 --json tagName \
          --jq '[.[].tagName | select(startswith("haybarn-v2.0"))][0]')
        if [ -z "$REL" ] || [ "$REL" = "null" ]; then
          echo "::error::no haybarn-v2.0.* release found" >&2
          exit 1
        fi
        gh release download "$REL" --repo Query-farm-haybarn/haybarn \
          --pattern 'haybarn_unittest-linux-amd64.zip' --output hb.zip --clobber
        mkdir -p hb && unzip -o -q hb.zip -d hb
        export HAYBARN_UNITTEST="$PWD/$(find hb -name 'haybarn-unittest' -type f | head -1)"
        chmod +x "$HAYBARN_UNITTEST"
        echo "::endgroup::"

        echo "::group::stdio entrypoint smoke (cold container per ATTACH)"
        TRANSPORT=stdio \
          WORKER="docker run -i --rm $CITEST_IMAGE stdio" \
          ci/run-integration.sh
        echo "::endgroup::"

        echo "::group::full SQL suite — HTTP transport (one warm container)"
        CID=$(docker run -d -p 18000:8000 "$CITEST_IMAGE")
        trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18000/health && break; sleep 1; done
        TRANSPORT=http WORKER_URL="http://localhost:18000" ci/run-integration.sh
        echo "::endgroup::"
